name: refresh merged open-source PRs

on:
  schedule:
    - cron: "47 18 * * *" # 00:17 IST, after the quote rotation
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/oss.json", ".github/scripts/oss_prs.py", ".github/workflows/oss.yml"]

concurrency:
  group: readme-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the oss block in README
        run: python3 .github/scripts/oss_prs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "merged open-source PRs: $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin main
          git push
